<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Directions</title>
<!--
  The CRM's map buttons on Messenger land here (src/lib/member/crm-maps.ts,
  navLink). Messenger opens a link in its own browser, where Google Maps' and
  Waze's web links offer to download the app instead of opening it (user
  2026-10-09). This page hands the address straight to the app — iOS by the
  app's own scheme, Android by an intent naming the app, falling back to the
  web map — and keeps a button to tap, since a browser may want a tap before
  it opens an app. It only ever opens Google Maps or Waze with the address it
  was given (no other destination), and writes the address as text.
-->
<style>
  :root { --bg: #FBF7F3; --card: #fff; --ink: #3F2B22; --sub: #806B60; --rust: #BD4A19; --line: #EBDDD2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1E1712; --card: #2A211B; --ink: #F5EEE9; --sub: #B5A398; --line: #3F332B; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px 20px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p { margin: 0 0 20px; color: var(--sub); font-size: 14px; word-break: break-word; }
  a.btn { display: block; padding: 14px; border-radius: 14px; background: var(--rust); color: #fff; font-weight: 650; text-decoration: none; }
  a.web { display: inline-block; margin-top: 14px; color: var(--sub); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening directions…</h1>
  <p id="addr"></p>
  <a id="app" class="btn" href="#">Open</a>
  <a id="web" class="web" href="#">Open the map in the browser instead</a>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var waze = params.get("to") === "waze";
  var address = (params.get("q") || "").slice(0, 400);
  var q = encodeURIComponent(address);
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua), android = /Android/i.test(ua);
  var name = waze ? "Waze" : "Google Maps";
  var web = waze ? "https://waze.com/ul?q=" + q + "&navigate=yes" : "https://www.google.com/maps/search/?api=1&query=" + q;
  var app = web;
  if (ios) app = waze ? "waze://?q=" + q + "&navigate=yes" : "comgooglemaps://?q=" + q;
  else if (android) app = waze
    ? "intent://?q=" + q + "&navigate=yes#Intent;scheme=waze;package=com.waze;S.browser_fallback_url=" + encodeURIComponent(web) + ";end"
    : "intent://maps.google.com/maps?q=" + q + "#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  document.title = name;
  document.getElementById("title").textContent = address ? "Opening " + name + "…" : "No address";
  document.getElementById("addr").textContent = address;
  var a = document.getElementById("app"), w = document.getElementById("web");
  a.textContent = "Open " + name;
  a.href = app;
  w.href = web;
  if (address) location.href = app;
})();
</script>
</body>
</html>
