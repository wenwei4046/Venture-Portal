const GROUP_EL = {daily:'nav-daily',loans:'nav-loans',billing:'nav-billing',directors:'nav-directors',reconcile:'nav-reconcile',admin:'nav-admin'};

function renderNav(active){
  NAV.forEach(n=>{
    const host = document.getElementById(GROUP_EL[n.group]);
    if(!host) return;
    const a = document.createElement('a');
    a.href='#'+n.id;
    a.dataset.id=n.id;
    a.className = (n.id===active)?'active':'';
    a.innerHTML = `<span>${n.label}</span>${n.count?`<span class="count">${n.count}</span>`:''}`;
    a.onclick=(e)=>{e.preventDefault();goto(n.id)};
    host.appendChild(a);
  });
}
function updateActiveNav(id){
  document.querySelectorAll('.sidebar .nav a').forEach(a=>a.classList.toggle('active', a.dataset.id===id));
  document.querySelectorAll('#pagebar button').forEach(b=>b.classList.toggle('on', b.dataset.id===id));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id==='scr-'+id));
  try{localStorage.setItem('vp.finance.page', id)}catch(e){}
  window.scrollTo({top:0,behavior:'instant'});
}
function goto(id){updateActiveNav(id)}

function renderPageBar(){
  const bar = document.getElementById('pagebar');
  NAV.forEach(n=>{
    const b=document.createElement('button');
    b.textContent=n.label;
    b.dataset.id=n.id;
    b.onclick=()=>goto(n.id);
    bar.appendChild(b);
  });
}

      <tr style="background:var(--surface-2)">
        <td></td><td></td>
        <td class="serif" style="font-weight:600">Net movement this period</td>
        <td class="num" style="font-weight:700">${(() => { const net = ledger.reduce((s,r)=>s+r.amount,0); return (net>=0?'+ ':'− ')+RM(Math.abs(net)); })()}</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="sect">
  <h2>Accumulator breakdown</h2>
  <p class="sub">Invoice accumulator held per-director; settles out as Finance-issued invoices to each subsidiary.</p>
  <table class="ledger">
    <thead><tr><th>Director</th><th class="th-right">5% Saving balance</th><th class="th-right">Invoice share</th><th class="th-right">Payout YTD</th></tr></thead>
    <tbody>
      ${DIRECTORS.map((dir,i)=>`
        <tr>
          <td class="serif">${dir.name} <span class="mono-xs">· ${dir.code}</span></td>
          <td class="num ledger">${RM(dir.savingBalance)}</td>
          <td class="num">${RM(invoiceAccum*dir.weight)}</td>
          <td class="num grap">${RM(DSAL_POOL*dir.weight*3)}</td>
        </tr>`).join('')}
    </tbody>
  </table>
</div>`;
}

function screen_reports(){
  const reports = [
    ['P&L by period','Interest income, rent, salaries, shared services bill-back.'],
    ['Cash movement','Daily, weekly, monthly by bank account.'],
    ['AR aging','Subsidiaries, directors, staff by bucket.'],
    ['Voucher audit','All vouchers posted with GL posting hash.'],
    ['Payroll register','Per-staff, per-dept monthly.'],
    ['Penalty register','Overdue stages and collections.'],
  ];
  return `
<div class="page-head">
  <div><h1 class="page">Reports</h1><p class="page-sub">Bookkeeper-facing reports. <em>Exportable to CSV and PDF.</em></p></div>
</div>
<div class="grid-2">
  ${reports.map(r=>`
    <div class="card" style="padding:28px">
      <h2 class="serif" style="font-size:22px;margin:0">${r[0]}</h2>
      <p class="serif" style="font-style:italic;color:var(--graphite);margin:6px 0 14px">${r[1]}</p>
      <button class="btn-link">Open report →</button>
    </div>`).join('')}
</div>`;
}

/* MOUNT */
const SCREENS = {
  dashboard:screen_dashboard, inbox:screen_inbox, vouchers:screen_vouchers,
  fundin:screen_fundin, fundout:screen_fundout, overdue:screen_overdue,
  statements:screen_statements, invoices:screen_invoices, payroll:screen_payroll,
  dsalaryBatch:screen_dsalaryBatch, dpool:screen_dpool,
  recon:screen_recon, gl:screen_gl,
  claims:screen_claims, reports:screen_reports,
};

const content = document.getElementById('content');
Object.entries(SCREENS).forEach(([id,fn])=>{
  const sec = document.createElement('div');
  sec.className='screen'; sec.id='scr-'+id;
  sec.innerHTML = fn();
  content.appendChild(sec);
  sec.querySelectorAll('table.ledger td.num').forEach(td=>{
    if(td.textContent.trim().startsWith('−')||td.textContent.trim().startsWith('-')) td.classList.add('neg');
  });
});

let initial='dashboard';
try{
  const saved=localStorage.getItem('vp.finance.page');
  if(saved && SCREENS[saved]) initial=saved;
  const hash=location.hash.replace('#','');
  if(hash && SCREENS[hash]) initial=hash;
}catch(e){}

renderNav(initial);
renderPageBar();
updateActiveNav(initial);
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(SCREENS[h]) goto(h)});
</script>
</body>
</html>
