<script>
const NAV = [
  {group:'overview', id:'overview', label:'Overview'},
  {group:'overview', id:'pool',     label:'Pool Ledger'},
  {group:'spend',    id:'opex',     label:'OPEX Requests', count:2},
  {group:'spend',    id:'claims',   label:'Claims'},
  {group:'people',   id:'team',     label:'Team'},
];
const GROUP_EL={overview:'nav-overview',spend:'nav-spend',people:'nav-people'};

function renderNav(active){
  NAV.forEach(n=>{
    const host=document.getElementById(GROUP_EL[n.group]); if(!host) return;
    const a=document.createElement('a'); a.href='#'+n.id; a.dataset.id=n.id;
    a.className=(n.id===active)?'active':'';
    a.innerHTML=`<span>${n.label}</span>${n.count?`<span class="count">${n.count}</span>`:''}`;
    a.onclick=(e)=>{e.preventDefault();goto(n.id)}; host.appendChild(a);
  });
}
function updateActiveNav(id){
  document.querySelectorAll('.sidebar .nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  document.querySelectorAll('#pagebar button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='scr-'+id));
  try{localStorage.setItem('vp.ops.page',id)}catch(e){}
  window.scrollTo({top:0,behavior:'instant'});
}
function goto(id){updateActiveNav(id)}
function renderPageBar(){
  const bar=document.getElementById('pagebar');
  NAV.forEach(n=>{const b=document.createElement('button');b.textContent=n.label;b.dataset.id=n.id;b.onclick=()=>goto(n.id);bar.appendChild(b)});
}

/* RM, bigRM come from portals/data.js. */

/* Operations dept pool — pulls from shared DEPTS */
const OPS = DEPTS.find(d=>d.code==='operations');

/* ───────────── SCREENS ───────────── */

function screen_team(){

/* MOUNT */
const SCREENS = {
  overview:screen_overview, pool:screen_pool,
  opex:screen_opex, claims:screen_claims,
  team:screen_team,
};

const content=document.getElementById('content');
Object.entries(SCREENS).forEach(([id,fn])=>{
  const sec=document.createElement('div'); sec.className='screen'; sec.id='scr-'+id;
  sec.innerHTML=fn(); content.appendChild(sec);
  sec.querySelectorAll('table.ledger td.num').forEach(td=>{if(td.textContent.trim().startsWith('−')||td.textContent.trim().startsWith('-'))td.classList.add('neg')});
});

let initial='overview';
try{
  const saved=localStorage.getItem('vp.ops.page'); if(saved&&SCREENS[saved]) initial=saved;
  const hash=location.hash.replace('#',''); if(hash&&SCREENS[hash]) initial=hash;
}catch(e){}

renderNav(initial); renderPageBar(); updateActiveNav(initial);
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(SCREENS[h]) goto(h)});
</script>
</body>
