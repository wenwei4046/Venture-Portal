<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Revenue → CRM curtain · motion reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=Inter+Tight:wght@650;750;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 16px; background: #F5EEE9; font-family: Inter, sans-serif; color: #3F2B22; }
  .phone { position: relative; width: 360px; height: 740px; border-radius: 44px; overflow: hidden; background: #fff; box-shadow: 0 0 0 8px #2A1D17, 0 24px 60px rgba(63,43,34,.25); }
  .screen { position: absolute; inset: 0; background: #fff; padding: 64px 20px 0; box-sizing: border-box; transform-origin: 50% 40%; }
  .chip { position: absolute; top: 52px; right: 20px; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #FFE5CF; color: #BD4A19; font-size: 13px; font-weight: 650; border: 0; cursor: pointer; overflow: hidden; }
  .ripple { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; background: #BD4A19; opacity: 0; pointer-events: none; }
  h2 { margin: 40px 0 4px; font-family: "Inter Tight", Inter, sans-serif; font-size: 26px; font-weight: 750; letter-spacing: -.03em; }
  p { margin: 0; font-size: 13px; color: #806B60; }
  .curtain { position: absolute; inset: 0; z-index: 5; background: #FFF0E4; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden; }
  .cap { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #806B60; opacity: 0; }
  .roll { position: relative; height: 56px; width: 260px; overflow: hidden; text-align: center; font-family: "Inter Tight", Inter, sans-serif; font-size: 46px; line-height: 56px; font-weight: 800; letter-spacing: -.04em; color: #BD4A19; }
  .roll span { position: absolute; left: 0; right: 0; top: 0; }
  .dots { display: flex; gap: 6px; opacity: 0; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: #BD4A19; animation: rvDot 1005ms linear infinite; }
  .dots i:nth-child(2) { animation-delay: 176ms; } .dots i:nth-child(3) { animation-delay: 352ms; }
  .foot { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-size: 13px; color: #806B60; opacity: 0; }
  @keyframes rvDot { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  .btn { height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid #E2CFC1; background: #fff; color: #3F2B22; font: 13px Inter, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<div class="phone">
  <div class="screen" id="rev"><button class="chip" id="chip">Revenue ▾<span class="ripple" id="rip"></span></button><h2>Hello, Jia Hui</h2><p>Sat, 17 Oct · Akemi brand week</p></div>
  <div class="screen" id="crm" style="visibility:hidden"><button class="chip">CRM ▾</button><h2>Your pipeline</h2><p>24 open leads · 6 to follow up today</p></div>
  <div class="curtain" id="cur">
    <span class="cap fade">Now opening</span>
    <div class="roll"><span id="w1">Revenue</span><span id="w2" style="transform:translateY(100%)">CRM</span></div>
    <div class="dots fade"><i></i><i></i><i></i></div>
    <span class="foot fade">24 open leads · 6 to follow up today</span>
  </div>
</div>
<button class="btn" id="replay">Tap “Revenue ▾” or replay</button>
<script>
const EASE = 'cubic-bezier(.2,.8,.2,1)';
const $ = id => document.getElementById(id);
const o = (delay, duration) => ({ delay, duration, easing: EASE, fill: 'both' });
let busy = false;
function reset() {
  $('rev').style.visibility = 'visible'; $('crm').style.visibility = 'hidden';
  $('cur').style.display = 'none';
  document.getAnimations().forEach(a => { if (!a.animationName) a.cancel(); });
  busy = false;
}
function run() {
  if (busy) return; busy = true;
  // 1. Tap feedback on chip (0–450ms)
  $('chip').animate([{ transform: 'scale(1)' }, { transform: 'scale(.96)' }, { transform: 'scale(1)' }], { duration: 250, easing: 'linear' });
  $('rip').animate([{ transform: 'scale(.2)', opacity: .3 }, { transform: 'scale(1.6)', opacity: 0 }], { duration: 450, easing: EASE });
  // 2. Curtain begins 400ms after tap
  setTimeout(() => {
    const cur = $('cur'); cur.style.display = 'flex';
    cur.animate([{ transform: 'translateY(100%)', borderRadius: '40px 40px 0 0' }, { transform: 'translateY(0)', borderRadius: '0' }], o(0, 550));
    $('rev').animate([{ transform: 'scale(1)' }, { transform: 'scale(.96)' }], o(0, 550));
    document.querySelectorAll('.fade').forEach(el => {
      el.animate([{ opacity: 0 }, { opacity: 1 }], o(350, 250));
      el.animate([{ opacity: 1 }, { opacity: 0 }], { delay: 1300, duration: 200, easing: EASE, fill: 'forwards', composite: 'replace' });
    });
    $('w1').animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], o(750, 400));
    $('w2').animate([{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }], o(750, 400));
    setTimeout(() => { $('rev').style.visibility = 'hidden'; $('crm').style.visibility = 'visible'; }, 550);
    cur.animate([{ transform: 'translateY(0)', borderRadius: '0' }, { transform: 'translateY(-100%)', borderRadius: '0 0 40px 40px' }], { delay: 1450, duration: 500, easing: EASE, fill: 'forwards' });
    $('crm').animate([{ transform: 'translateY(36px)' }, { transform: 'translateY(0)' }], { delay: 1500, duration: 550, easing: EASE, fill: 'backwards' });
    setTimeout(() => { cur.style.display = 'none'; busy = false; }, 2000);
  }, 400);
}
$('chip').onclick = run;
$('replay').onclick = () => { reset(); requestAnimationFrame(run); };
</script>
</body>
</html>
