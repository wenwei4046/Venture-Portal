name: Test

# A change to the docs alone (*.md, docs/, the design handoff) cannot break a
# build or a test — nothing reads them — so it does not wait on CI at all.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.design/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.design/**']

# FOUR JOBS SIDE BY SIDE (2026-10-06). The old single job ran install → unit
# tests (5m14s) → the SQL checks (53s) → next build (3m34s) one after another,
# ~10.5 min on every PR. Side by side the wait is the slowest job (~5 min); the
# runner minutes stay about the same: each job installs on its own (34s, npm's
# download cache), and the builds now reuse .next/cache.
jobs:
  unit:
    # The suite (4,400+ tests) is split by file into two halves run at once.
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # wrangler requires >=22 (engines). Every job stays on one version so
          # the two `next build`s never run on different runtimes.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci -- --shard=${{ matrix.shard }}/2

  sql:
    # Each SQL check is its own package (PGlite only) — the app's install is
    # not needed here.
    name: SQL checks (member + Revenue payroll)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            tests/member-sql/package-lock.json
            tests/revenue-payroll-sql/package-lock.json

      - name: Verify member database permissions and workflows
        run: |
          npm ci --prefix tests/member-sql
          npm test --prefix tests/member-sql

      - name: Verify Revenue payroll SQL integration
        run: |
          npm ci --prefix tests/revenue-payroll-sql
          npm test --prefix tests/revenue-payroll-sql

  build:
    name: Next.js build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Next's own compile cache: an exact hit when nothing under src/ changed,
      # else the latest one for these dependencies, which still saves most of
      # the work. A PR reads main's caches; main never reads a PR's.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-build-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-build-${{ hashFiles('package-lock.json') }}-

      # Next 16 (2026-10-21): `next build` no longer runs ESLint and `next lint`
      # is gone. The build used to fail on an ESLint error; this keeps that —
      # errors fail the job, warnings do not (as before).
      - name: Lint
        run: npm run lint -- --quiet

      - name: Next.js build check
        run: npm run build
        env:
          # Build needs NEXT_PUBLIC_* env vars to compile — use placeholders
          # so `next build` doesn't fail on missing config. Real values live
          # in Vercel project settings for actual deployments.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          # The build outgrew Node's default ~2 GB heap (2026-10-06: "JavaScript
          # heap out of memory" on main #204 and on PR #203, green on a rerun).
          # The runner has 7 GB; 4 GB ends the coin toss without touching what
          # Vercel builds.
          NODE_OPTIONS: --max-old-space-size=4096

  worker:
    name: Cloudflare worker build + PDF smoke
    runs-on: ubuntu-latest

    # WHY THIS JOB IS SEPARATE FROM `build`
    # ------------------------------------
    # The `build` job above runs `next build`, which does NOT exercise the worker
    # bundle at all. yoga-layout compiles its flexbox engine from a base64 blob
    # with WebAssembly.instantiate(), which workerd forbids — so every PDF export
    # route can be perfectly green there and return HTTP 500 once deployed to
    # Cloudflare. Only `opennextjs-cloudflare build` produces the artifact where
    # that difference shows up, and only running it proves anything.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # NOTE: plain `npm ci`, deliberately. The yoga WASM fix is applied by the
      # `postinstall` hook (tools/patch-yoga-wasm.mjs), so `--ignore-scripts`
      # would silently skip the very thing this job exists to verify.
      - name: Install dependencies
        run: npm ci

      # The worker's `next build` keeps its own cache (OpenNext builds with its
      # own settings, so it never shares the build job's).
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-worker-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-worker-${{ hashFiles('package-lock.json') }}-

      # Builds the worker, then asserts the bundle carries the statically imported
      # WASM module, then starts the built worker in workerd and asks it for a real
      # PDF whose geometry is checked. The last step is the one that cannot be
      # faked: a fix that is present but fails to load passes the static checks and
      # only fails here.
      - name: Verify worker bundle and render a PDF in workerd
        run: npm run verify:worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          # Same 4 GB heap as the build check above: the worker build runs a full
          # `next build` underneath and hit the same 2 GB wall (PR #203).
          NODE_OPTIONS: --max-old-space-size=4096
